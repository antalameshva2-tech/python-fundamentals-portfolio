<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Introduction Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-section {
            padding: 30px;
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .result-section {
            padding: 30px;
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .result-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .result-card h3 {
            color: #667eea;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .result-card p {
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-edit {
            flex: 1;
            background: #667eea;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-edit:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .btn-print {
            flex: 1;
            background: #f0f0f0;
            color: #333;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-print:hover {
            background: #e0e0e0;
        }

        @media print {
            body {
                background: white;
            }
            .container {
                box-shadow: none;
                max-width: 100%;
            }
            .result-actions {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }
            .form-section, .result-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Personal Introduction</h1>
            <p>Tell us about yourself</p>
        </div>

        <!-- Form Section -->
        <div class="form-section active">
            <form id="introductionForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" placeholder="Enter your age" min="1" max="120" required>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="Enter your city" required>
                </div>

                <div class="form-group">
                    <label for="hobby">Hobby</label>
                    <input type="text" id="hobby" name="hobby" placeholder="Enter your hobby" required>
                </div>

                <div class="form-group">
                    <label for="language">Favorite Programming Language</label>
                    <select id="language" name="language" required>
                        <option value="">Select a language</option>
                        <option value="Python">Python</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="Java">Java</option>
                        <option value="C++">C++</option>
                        <option value="C#">C#</option>
                        <option value="PHP">PHP</option>
                        <option value="Ruby">Ruby</option>
                        <option value="Go">Go</option>
                        <option value="Rust">Rust</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-submit">Submit</button>
                    <button type="reset" class="btn-reset">Clear</button>
                </div>
            </form>
        </div>

        <!-- Result Section -->
        <div class="result-section" id="resultSection">
            <div class="result-card">
                <h3>Name</h3>
                <p id="resultName"></p>
            </div>

            <div class="result-card">
                <h3>Age</h3>
                <p id="resultAge"></p>
            </div>

            <div class="result-card">
                <h3>City</h3>
                <p id="resultCity"></p>
            </div>

            <div class="result-card">
                <h3>Hobby</h3>
                <p id="resultHobby"></p>
            </div>

            <div class="result-card">
                <h3>Favorite Programming Language</h3>
                <p id="resultLanguage"></p>
            </div>

            <div class="result-actions">
                <button class="btn-edit" onclick="editForm()">✏️ Edit</button>
                <button class="btn-print" onclick="window.print()">🖨️ Print</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('introductionForm');
        const formSection = document.querySelector('.form-section');
        const resultSection = document.getElementById('resultSection');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const city = document.getElementById('city').value;
            const hobby = document.getElementById('hobby').value;
            const language = document.getElementById('language').value;

            // Display results
            document.getElementById('resultName').textContent = name;
            document.getElementById('resultAge').textContent = age;
            document.getElementById('resultCity').textContent = city;
            document.getElementById('resultHobby').textContent = hobby;
            document.getElementById('resultLanguage').textContent = language;

            // Switch to result view
            formSection.classList.remove('active');
            resultSection.classList.add('active');
        });

        function editForm() {
            formSection.classList.add('active');
            resultSection.classList.remove('active');
        }
    </script>
</body>
</html>
